name: Secret scanning

# Deliberately triggers on every branch push, not just `main` (unlike
# ci.yml's other jobs). A real Google OAuth secret was committed straight to
# `stage-7-google` (never merged to main, no PR opened) and no gate ever ran
# against it: this workflow existed but only fired on `push: branches:
# [main]` / `pull_request`, so a direct push to a feature branch bypassed it
# entirely. See docs/security/threat-model.md, "Stage 8 Phase 2 focused
# remediation" for the incident this closes the gap for.
on:
  push:
  pull_request:

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI over the history reachable from whatever ref triggered
      # this run (full history back to the root, not a push-range diff): the
      # action's range logic breaks on any push containing the root commit
      # (<root>^ is not a valid revision) and needs no range to be thorough.
      - name: gitleaks (full history for this ref)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
      # Same tool and baseline as the local pre-commit hook: current-tree
      # scanning against the committed baseline, not history scanning.
      - uses: astral-sh/setup-uv@v5
      - name: detect-secrets against the committed baseline
        run: uvx --from detect-secrets detect-secrets-hook --baseline .secrets.baseline $(git ls-files | grep -v pnpm-lock.yaml)
      # Narrow, dedicated check: .env.example specifically must never hold a
      # live-secret-shaped value, regardless of what the broader scanners
      # above catch (see scripts/check_env_example_secrets.py).
      - name: .env.example placeholder check
        run: python3 scripts/check_env_example_secrets.py
