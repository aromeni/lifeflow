name: Secret scanning

# Deliberately triggers on every branch push, not just `main` (unlike
# ci.yml's other jobs). A real Google OAuth secret was committed straight to
# `stage-7-google` (never merged to main, no PR opened) and no gate ever ran
# against it: this workflow existed but only fired on `push: branches:
# [main]` / `pull_request`, so a direct push to a feature branch bypassed it
# entirely. See docs/security/threat-model.md, "Stage 8 Phase 2 focused
# remediation" for the incident this closes the gap for.
on:
  push:
  pull_request:

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI over full history, not a push-range diff: the action's
      # range logic breaks on any push containing the root commit (<root>^ is
      # not a valid revision) and needs no range to be thorough. `gitleaks
      # git` with no --log-opts scans every ref it can see in the repo it's
      # pointed at (verified directly — it is not scoped to HEAD/the
      # checked-out branch); in this job that's exactly the one branch
      # actions/checkout fetched, since fetch-depth: 0 only unshallows that
      # ref, it does not fetch other branches as remote-tracking refs.
      # .gitleaks.toml (repo root, auto-discovered) excludes .secrets.baseline
      # from matching — that file stores SHA-256 hashes of already-reviewed
      # findings, which look like high-entropy secrets to the generic-api-key
      # rule but aren't; verified this exclusion does not suppress a
      # genuinely reintroduced secret elsewhere.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
      # Same tool and baseline as the local pre-commit hook: current-tree
      # scanning against the committed baseline, not history scanning.
      - uses: astral-sh/setup-uv@v5
      - name: detect-secrets against the committed baseline
        run: uvx --from detect-secrets detect-secrets-hook --baseline .secrets.baseline $(git ls-files | grep -v pnpm-lock.yaml)
      # Narrow, dedicated check: .env.example specifically must never hold a
      # live-secret-shaped value, regardless of what the broader scanners
      # above catch (see scripts/check_env_example_secrets.py).
      - name: .env.example placeholder check
        run: python3 scripts/check_env_example_secrets.py
