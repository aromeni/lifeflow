name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, types, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeflow
          POSTGRES_PASSWORD: lifeflow # pragma: allowlist secret
          POSTGRES_DB: lifeflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lifeflow -d lifeflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lifeflow:lifeflow@localhost:5433/lifeflow # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:format:check
      - run: pnpm web:lint
      - run: pnpm web:typecheck
      - run: pnpm web:test
      - run: pnpm web:build

  contracts:
    name: Contracts — generated types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --locked
      - run: ./scripts/generate-contracts.sh
      - name: Fail if committed contracts are stale
        run: |
          git diff --exit-code packages/contracts \
            || { echo "::error::packages/contracts is stale — run ./scripts/generate-contracts.sh and commit the result."; exit 1; }

  evaluations:
    name: Evaluations — signals, briefs, action proposals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: cd apps/api && uv sync --locked
      - run: ./scripts/run-evals.sh det
      - run: ./scripts/run-evals.sh det+mock
      - run: ./scripts/run-evals.sh brief
      - run: ./scripts/run-evals.sh brief+mock
      - run: ./scripts/run-evals.sh actions

  e2e:
    name: E2E — demo journey (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeflow
          POSTGRES_PASSWORD: lifeflow # pragma: allowlist secret
          POSTGRES_DB: lifeflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lifeflow -d lifeflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lifeflow:lifeflow@localhost:5433/lifeflow # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --locked
      - run: cd apps/api && uv run alembic upgrade head
      - run: pnpm --filter @lifeflow/web exec playwright install chromium --with-deps
      - run: pnpm web:e2e

  e2e-resilience:
    name: E2E — outage resilience journeys (Playwright)
    runs-on: ubuntu-latest
    needs: e2e
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --locked
      - run: pnpm --filter @lifeflow/web exec playwright install chromium --with-deps
      # Runs against its own dedicated stack (a synthetic fake-Google server,
      # never real Google credentials) and starts/stops its own PostgreSQL
      # and Redis via docker compose — deliberately a separate job from `e2e`
      # above (gated with `needs: e2e`) rather than a step in it, since
      # Journey D stops/restarts the shared dependency containers and must
      # never run concurrently with the other suite against shared state.
      - run: ./scripts/e2e-resilience.sh
      - name: Upload Playwright trace/report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resilience-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
