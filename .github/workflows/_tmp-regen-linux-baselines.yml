name: _tmp regen linux visual baselines

on:
  push:
    branches: [stage-11a-phase-1-synthetic-validation]

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --locked
      - run: pnpm --filter @lifeflow/web exec playwright install chromium --with-deps
      - run: ./scripts/e2e-design.sh visual-regression.spec.ts --update-snapshots
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: apps/web/e2e-design/visual-regression.spec.ts-snapshots/*-linux.png
