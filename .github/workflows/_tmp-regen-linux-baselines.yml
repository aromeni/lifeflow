name: TMP regen Linux design baselines (Phase 6A.1 connector-gate closure)

on:
  push:
    branches: [stage-11a-phase-6a1-frontend-oauth-visibility]

jobs:
  regen:
    name: Regenerate Linux visual baselines under the fixed demo clock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --locked
      - run: pnpm --filter @lifeflow/web exec playwright install chromium --with-deps
      - run: ./scripts/e2e-design.sh visual-regression.spec.ts --update-snapshots
      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: apps/web/e2e-design/visual-regression.spec.ts-snapshots/*-linux.png
          retention-days: 3
          if-no-files-found: error
