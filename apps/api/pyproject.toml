[project]
name = "lifeflow-api"
version = "0.1.0"
description = "LifeFlow AI backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "cryptography>=44",
    "itsdangerous>=2.2",
    "anthropic>=0.116",
    "httpx>=0.28",
    "google-auth>=2.36",
    "arq>=0.28.0",
    "redis>=5.0",
    # Stage 9 Delivery Phase 5: bounded-cardinality operational metrics
    # (/metrics). A small, single-purpose client library (no transitive
    # dependencies of its own), not an observability platform — chosen over
    # hand-rolling Prometheus's text exposition format, and reused rather
    # than introducing a second metrics mechanism later.
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeflow_api"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit security rules
    "N",         # naming
    "RUF",
]
[tool.ruff.lint.per-file-ignores]
# S101: assert is expected in tests. E501: fixture literals (URLs with
# allowlist pragmas) legitimately exceed the line limit. S105/S106/S107:
# fixtures use obviously-fictional credentials for the dev database and
# cipher tests, including as default parameter values (e.g. a seed helper's
# `refresh_token="refresh-1"`).
"tests/**" = ["S101", "E501", "S105", "S106", "S107"]
# Exact-file, non-secret only: the smoke script shells out to Alembic via a
# fixed argv (`uv run alembic …`); S603/S607's line attribution varies by ruff
# version so an inline noqa is not portable. No secret rule is exempted here and
# no wildcard is used, so future scripts are not covered.
"scripts/smoke_phase2.py" = ["S603", "S607"]
# Exact-file, non-secret only: the real-Uvicorn regression shells out to the
# repository's own `uv run uvicorn …` via a fixed argv, the same pattern as
# smoke_phase2.py above.
"tests/test_rate_limit_uvicorn_regression.py" = ["S603", "S607"]
# Exact-file, non-secret only: Stage 11A Phase 2's backup/restore rehearsal
# shells out to `docker compose exec db pg_dump/pg_restore` via a fixed
# argv, the same pattern as smoke_phase2.py above. The companion rollback
# rehearsal is a shell script (scripts/stage11a-phase2-rollback-rehearsal.sh
# at the repository root), so it is outside this Python linter's scope.
"scripts/stage11a_phase2_backup_restore_rehearsal.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lifeflow_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src: fallback import path — on macOS, sync tools (e.g. iCloud) can set the
# hidden flag on the editable-install .pth, which Python 3.12+ then skips.
# ".": makes tests.conftest importable from test modules.
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: requires a running PostgreSQL (docker compose up -d db)",
]
