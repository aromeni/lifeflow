title = "lifeflow gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "detect-secrets' own baseline file stores SHA-256 hashes of already-reviewed findings; those hashes look like high-entropy secrets to gitleaks' generic-api-key rule but are not secrets themselves. Verified this does not suppress a genuinely reintroduced secret (only this exact path is excluded)."
paths = [
    '''\.secrets\.baseline$''',
]
# Exact-literal only, never a path or pattern exclusion: this is the fixed,
# synthetic TOKEN_KEY value scripts/resilience-api-env.sh and
# apps/api/scripts/e2e_google_support.py share (Stage 9 Delivery Phase 5,
# ADR 0005 D92) so the dedicated resilience-journey API can decrypt what the
# seed script encrypts. It is base64 of the literal ASCII string
# "e2e-resilience-fake-token-key-32" — never derived from, or capable of
# decrypting, anything real — flagged only because base64 encoding of a
# readable phrase still looks like high entropy to a generic-secret rule.
# A genuinely different (real) secret introduced anywhere else in the repo
# does not match this exact string and is still caught.
regexes = [
    '''ZTJlLXJlc2lsaWVuY2UtZmFrZS10b2tlbi1rZXktMzI=''',
]
